name: Build Debug APK

on:
  push:
    branches:
      - claude/android-schedule-app-dqr4jd
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: schedule-link-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Rename APK for release
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/schedule-link-debug.apk

      - name: Publish/update debug release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-build
          name: "Debug build (latest)"
          body: "スマホから直接ダウンロードしてインストールできるデバッグ用APKです。最新のpushで自動更新されます。"
          files: app/build/outputs/apk/debug/schedule-link-debug.apk
